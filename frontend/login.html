<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <nav class="navbar">
        <a href="home.html" class="nav-logo">Blog Space</a>
        <button class="hamburger" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <ul class="nac-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="login.html" class="acive">Login</a></li>
            <li><a href="register.html" class="btn-nav">Get Started</a></li>
            </li>
        </ul>
    </nav>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to your BlogSpace account</p>
 
      <form id="loginForm" novalidate>
 
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" />
          <span class="error-msg"></span>
        </div>
 
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" />
          <span class="error-msg"></span>
        </div>
 
        <div style="text-align:right; margin-bottom:1rem;">
          <a href="#" style="font-size:0.85rem; color:var(--primary);">Forgot password?</a>
        </div>
 
        <button type="submit" class="btn btn-primary btn-full">Log In</button>
 
      </form>
 
      <div class="divider">or</div>
 
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Sign up free</a>
      </div>
    </div>
  </div>
 
 
  <footer>
    <p>© 2025 BlogSpace · <a href="#">GitHub</a></p>
  </footer>
 
  <div class="toast"></div>
  <script src="js/script.js"></script>
</body>
</html>
